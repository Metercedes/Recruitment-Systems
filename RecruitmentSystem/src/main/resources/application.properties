spring.application.name=recruitment-platform
server.port=${SERVER_PORT:8098}

# Required. AES-256 key, Base64, 32 bytes. Generate with: openssl rand -base64 32
# There is no default: the previous version generated a key at startup and printed it to the
# console, which both logged the key and made stored data unreadable after a restart.
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Optional. When unset, no administrator account exists at all. The previous version compiled
# the credentials admin / admin123 into the source.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

app.recaptcha.secret=${APP_RECAPTCHA_SECRET:}
app.recaptcha.sitekey=${APP_RECAPTCHA_SITEKEY:}
app.recaptcha.enabled=${APP_RECAPTCHA_ENABLED:false}

server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Set to true wherever the application is served over HTTPS, which is everywhere except a
# local plain-HTTP run.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.SECURITY=INFO
logging.level.com.example.recruitmentsystem=INFO
